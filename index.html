<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>雷霆戰機 - 飛機射擊遊戲</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Microsoft JhengHei", system-ui, sans-serif;
    background:radial-gradient(ellipse at 50% 30%, #1a2a6c 0%, #0a0e2a 60%, #020208 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    color:#fff; padding:12px; user-select:none; -webkit-user-select:none;
  }
  #wrap { width:min(480px,100vw - 16px); }
  #hud {
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    border-radius:12px; padding:8px 12px; margin-bottom:8px; font-size:14px;
    backdrop-filter:blur(6px);
  }
  #hud b { color:#ffd54a; font-size:16px; }
  #hud .hp { color:#ff6b6b; letter-spacing:2px; }
  #stage { position:relative; border-radius:16px; overflow:hidden;
    border:1px solid rgba(255,255,255,.2); box-shadow:0 10px 50px rgba(0,200,255,.25); }
  canvas { display:block; width:100%; height:auto; background:#050818; touch-action:none; cursor:crosshair; }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(3,6,20,.82); backdrop-filter:blur(4px); padding:24px; z-index:5;
  }
  .overlay.hidden { display:none; }
  .overlay h1 {
    font-size:42px; letter-spacing:4px; margin-bottom:6px;
    background:linear-gradient(180deg,#fff,#4dd0ff); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(77,208,255,.4);
  }
  .overlay h2 { font-size:28px; margin-bottom:8px; color:#ff6b6b; }
  .overlay p { font-size:14px; line-height:1.8; color:#cbd5ff; margin-bottom:14px; }
  .overlay .keys { font-size:12px; background:rgba(255,255,255,.08); border-radius:8px; padding:8px 12px; margin-bottom:16px; }
  .btn {
    font-size:18px; font-weight:700; color:#04263b; border:none; cursor:pointer;
    background:linear-gradient(180deg,#7ee7ff,#2196f3); padding:12px 42px; border-radius:999px;
    box-shadow:0 4px 20px rgba(33,150,243,.6); transition:transform .1s;
  }
  .btn:active { transform:scale(.95); }
  .btn.ghost { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.4); box-shadow:none; font-size:14px; padding:9px 24px; margin-top:10px; }
  #controls { display:flex; gap:8px; margin-top:8px; }
  #controls button {
    flex:1; padding:10px 0; border-radius:10px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08); color:#fff; font-size:14px; cursor:pointer;
  }
  #controls button.active { background:#2196f3; border-color:#2196f3; }
  .hint { text-align:center; font-size:12px; color:#8ea0c8; margin-top:8px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>分數 <b id="score">0</b></div>
    <div>最高 <b id="best">0</b></div>
    <div>等級 Lv.<b id="level">1</b></div>
    <div class="hp" id="hp">♥♥♥</div>
  </div>
  <div id="stage">
    <canvas id="game" width="480" height="720"></canvas>

    <div class="overlay" id="menu">
      <h1>雷霆戰機</h1>
      <p>駕駛戰機，迎擊一波波敵機與菁英 Boss！<br>撿取道具強化火力，挑戰最高分。</p>
      <div class="keys">🖱️ 滑鼠 / 手指拖曳移動 ｜ ⌨️ WASD / 方向鍵<br>空白鍵射擊（預設自動射擊）｜ P 暫停</div>
      <button class="btn" id="startBtn">開始遊戲</button>
      <button class="btn ghost" id="soundBtn">🔊 音效：開</button>
    </div>

    <div class="overlay hidden" id="over">
      <h2>GAME OVER</h2>
      <p id="finalScore">分數：0</p>
      <button class="btn" id="restartBtn">再來一局</button>
      <button class="btn ghost" id="backBtn">回主選單</button>
    </div>

    <div class="overlay hidden" id="pause">
      <h2 style="color:#7ee7ff">已暫停</h2>
      <p>按 P 或點擊按鈕繼續</p>
      <button class="btn" id="resumeBtn">繼續遊戲</button>
    </div>
  </div>
  <div id="controls">
    <button id="autoBtn" class="active">自動射擊：開</button>
    <button id="pauseBtn">暫停 (P)</button>
    <button id="muteBtn">🔊</button>
  </div>
  <div class="hint">道具：🅿️ 雙排/三排火力 ｜ 🛡️ 護盾 ｜ 💚 回血 ｜ Boss 每 500 分出現</div>
</div>

<script>
(() => {
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const $ = id => document.getElementById(id);
const ui = { score:$('score'), best:$('best'), level:$('level'), hp:$('hp'),
  menu:$('menu'), over:$('over'), pause:$('pause'), finalScore:$('finalScore') };

let state = 'menu'; // menu | playing | paused | over
let score = 0, best = +(localStorage.getItem('plane_best') || 0);
let level = 1, frame = 0, lastTime = 0;
let soundOn = true, autoFire = true;
ui.best.textContent = best;

// ---------- 音效 ----------
let AC = null;
function beep(freq, dur=0.08, type='square', vol=0.12){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
const sfx = {
  shoot(){ beep(880, .05, 'square', .05); },
  boom(){ beep(120, .25, 'sawtooth', .18); },
  hit(){ beep(220, .15, 'sawtooth', .15); },
  power(){ beep(660,.1,'sine',.15); setTimeout(()=>beep(990,.12,'sine',.15),90); },
  boss(){ beep(90,.5,'sawtooth',.2); }
};

// ---------- 實體 ----------
const player = { x:W/2, y:H-110, r:16, hp:3, maxHp:3, weapon:1, shield:0, inv:0, cool:0 };
let bullets=[], ebullets=[], enemies=[], parts=[], items=[], stars=[];
let boss = null, bossTimer = 500;

for(let i=0;i<90;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+0.5, v:Math.random()*120+40});

function reset(){
  score=0; level=1; frame=0; bossTimer=500;
  player.x=W/2; player.y=H-110; player.hp=3; player.weapon=1; player.shield=0; player.inv=120; player.cool=0;
  bullets=[]; ebullets=[]; enemies=[]; parts=[]; items=[]; boss=null;
  updateHUD();
}

function updateHUD(){
  ui.score.textContent = score;
  ui.level.textContent = level;
  ui.hp.textContent = '♥'.repeat(Math.max(0,player.hp)) + '♡'.repeat(Math.max(0,player.maxHp-player.hp));
  if(score > best){ best = score; localStorage.setItem('plane_best', best); ui.best.textContent = best; }
}

// ---------- 輸入 ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if(e.key === ' '){ e.preventDefault(); if(state==='playing') fire(); }
  if(e.key.toLowerCase() === 'p') togglePause();
  if(e.key === 'Enter' && state !== 'playing') startGame();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let dragging = false;
function toGame(e){
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H };
}
canvas.addEventListener('mousedown', e => { dragging=true; Object.assign(player, toGame(e)); });
addEventListener('mousemove', e => { if(dragging && state==='playing') Object.assign(player, toGame(e)); });
addEventListener('mouseup', () => dragging=false);
canvas.addEventListener('touchstart', e => { e.preventDefault(); dragging=true; Object.assign(player, toGame(e)); }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); if(state==='playing') Object.assign(player, toGame(e)); }, {passive:false});
canvas.addEventListener('touchend', () => dragging=false);

// ---------- 發射 / 生成 ----------
function fire(){
  if(player.cool > 0) return;
  player.cool = player.weapon >= 3 ? 9 : 12;
  const y = player.y - 24;
  if(player.weapon === 1) bullets.push({x:player.x, y, vy:-620, r:4});
  else if(player.weapon === 2){ bullets.push({x:player.x-10,y,vy:-620,r:4}); bullets.push({x:player.x+10,y,vy:-620,r:4}); }
  else { bullets.push({x:player.x,y,vy:-680,r:4}); bullets.push({x:player.x-14,y:player.y-10,vy:-600,vx:-90,r:4}); bullets.push({x:player.x+14,y:player.y-10,vy:-600,vx:90,r:4}); }
  sfx.shoot();
}
function spawnEnemy(){
  const lv = level;
  const roll = Math.random();
  let e;
  if(roll < 0.55) e = { kind:0, x:20+Math.random()*(W-40), y:-30, r:14, hp:1+Math.floor(lv/3), vy:120+lv*14+Math.random()*60, score:10, t:0, cool:60+Math.random()*80 };
  else if(roll < 0.85) e = { kind:1, x:30+Math.random()*(W-60), y:-36, r:18, hp:3+Math.floor(lv/2), vy:80+lv*10, score:30, t:0, cool:50+Math.random()*60 };
  else e = { kind:2, x:40+Math.random()*(W-80), y:-40, r:22, hp:6+lv, vy:55+lv*7, score:60, t:0, cool:40+Math.random()*50 };
  enemies.push(e);
}
function spawnBoss(){
  sfx.boss();
  boss = { x:W/2, y:-80, r:44, hp:60+level*12, maxHp:60+level*12, t:0, cool:60, score:300, dir:1 };
  enemies.push(boss); boss.isBoss = true;
}
function explode(x,y,n=16,color=null){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 60+Math.random()*260;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.5+Math.random()*.5,
      c:color || ['#ffd54a','#ff6b6b','#7ee7ff','#fff'][i%4], r:2+Math.random()*3});
  }
}
function drop(x,y){
  if(Math.random() < 0.12){
    const k = ['P','S','H'][Math.floor(Math.random()*3)];
    items.push({x,y,vy:110,r:13,kind:k,t:0});
  }
}
function damagePlayer(n=1){
  if(player.inv>0 || state!=='playing') return;
  if(player.shield>0){ player.shield--; player.inv=60; sfx.hit(); return; }
  player.hp -= n; player.inv = 120; sfx.hit();
  explode(player.x, player.y, 20);
  if(player.hp<=0){ gameOver(); }
  updateHUD();
}

// ---------- 流程 ----------
function startGame(){
  reset();
  state='playing';
  ui.menu.classList.add('hidden'); ui.over.classList.add('hidden'); ui.pause.classList.add('hidden');
}
function gameOver(){
  state='over'; sfx.boom();
  explode(player.x, player.y, 40);
  updateHUD();
  ui.finalScore.innerHTML = `分數：<b style="color:#ffd54a;font-size:22px">${score}</b><br><span style="font-size:13px">最高：${best} ｜ 等級：Lv.${level}</span>`;
  setTimeout(()=> ui.over.classList.remove('hidden'), 600);
}
function togglePause(){
  if(state==='playing'){ state='paused'; ui.pause.classList.remove('hidden'); }
  else if(state==='paused'){ state='playing'; ui.pause.classList.add('hidden'); lastTime=performance.now(); }
}

$('startBtn').onclick = startGame;
$('restartBtn').onclick = startGame;
$('backBtn').onclick = () => { state='menu'; ui.over.classList.add('hidden'); ui.menu.classList.remove('hidden'); };
$('resumeBtn').onclick = togglePause;
$('pauseBtn').onclick = togglePause;
$('soundBtn').onclick = e => { soundOn=!soundOn; e.target.textContent = soundOn?'🔊 音效：開':'🔇 音效：關'; $('muteBtn').textContent = soundOn?'🔊':'🔇'; };
$('muteBtn').onclick = () => $('soundBtn').click();
$('autoBtn').onclick = e => { autoFire=!autoFire; e.target.textContent=`自動射擊：${autoFire?'開':'關'}`; e.target.classList.toggle('active',autoFire); };

// ---------- 更新 ----------
function update(dt){
  frame++;
  // 背景星星
  for(const s of stars){ s.y += s.v*dt; if(s.y>H){ s.y=0; s.x=Math.random()*W; } }
  if(state!=='playing') return;

  level = 1 + Math.floor(score/300);
  player.cool--; player.inv--; if(player.shield>0) player.shield-=dt;

  // 鍵盤移動
  const sp = 340*dt;
  if(keys['arrowleft']||keys['a']) player.x-=sp;
  if(keys['arrowright']||keys['d']) player.x+=sp;
  if(keys['arrowup']||keys['w']) player.y-=sp;
  if(keys['arrowdown']||keys['s']) player.y+=sp;
  player.x = Math.max(18,Math.min(W-18,player.x));
  player.y = Math.max(60,Math.min(H-40,player.y));
  if(autoFire) fire();

  // 生成敵機
  const interval = Math.max(18, 55 - level*4);
  if(frame % interval === 0) spawnEnemy();
  bossTimer -= dt*60;
  if(bossTimer<=0 && !enemies.some(e=>e.isBoss)){ spawnBoss(); bossTimer = 1400; }

  // 子彈
  for(const b of bullets){ b.y += b.vy*dt; if(b.vx) b.x+=b.vx*dt; }
  bullets = bullets.filter(b=>b.y>-20 && b.x>-20 && b.x<W+20);
  for(const b of ebullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; }
  ebullets = ebullets.filter(b=>b.y<H+20 && b.y>-20 && b.x>-20 && b.x<W+20);

  // 敵機
  for(const e of enemies){
    e.t += dt; e.cool--;
    if(e.isBoss){
      if(e.y < 130) e.y += 60*dt;
      else { e.x += e.dir*110*dt; if(e.x<60||e.x>W-60) e.dir*=-1;
        if(e.cool<=0){ e.cool = Math.max(25, 70-level*3);
          for(let k=-2;k<=2;k++) ebullets.push({x:e.x,y:e.y+30,vx:k*70,vy:220,r:5});
          sfx.shoot();
        } }
    } else {
      e.y += e.vy*dt;
      if(e.kind===2) e.x += Math.sin(e.t*3)*60*dt;
      if(e.cool<=0 && e.y>0 && e.y<H*0.6){ e.cool = 110 - Math.min(60,level*4);
        ebullets.push({x:e.x,y:e.y+14,vx:0,vy:200+level*12,r:5});
        if(e.kind===2){ ebullets.push({x:e.x-10,y:e.y+10,vx:-70,vy:190,r:5}); ebullets.push({x:e.x+10,y:e.y+10,vx:70,vy:190,r:5}); }
      }
    }
  }
  enemies = enemies.filter(e=>e.y<H+70 && e.hp>0);

  // 道具 / 粒子
  for(const it of items){ it.y += it.vy*dt; it.t+=dt; }
  items = items.filter(i=>i.y<H+20);
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
  parts = parts.filter(p=>p.life>0);

  // 碰撞：玩家子彈 vs 敵機
  for(const b of bullets){
    for(const e of enemies){
      if(e.hp>0 && (b.x-e.x)**2+(b.y-e.y)**2 < (b.r+e.r)**2){
        b.y = -999; e.hp--; score += 2;
        if(e.hp<=0){ score += e.score; explode(e.x,e.y, e.isBoss?50:18); drop(e.x,e.y); sfx.boom();
          if(e.isBoss){ bossTimer = 1400; }
        }
        break;
      }
    }
  }
  bullets = bullets.filter(b=>b.y>-20);

  // 碰撞：敵子彈 / 敵機 vs 玩家
  for(const b of ebullets){
    if((b.x-player.x)**2+(b.y-player.y)**2 < (b.r+player.r-4)**2){ b.y=H+999; damagePlayer(1); }
  }
  ebullets = ebullets.filter(b=>b.y<H+30);
  for(const e of enemies){
    if(e.hp>0 && (e.x-player.x)**2+(e.y-player.y)**2 < (e.r+player.r-6)**2){
      e.hp = 0; explode(e.x,e.y,20); damagePlayer(1);
    }
  }
  enemies = enemies.filter(e=>e.hp>0);
  for(const it of items){
    if((it.x-player.x)**2+(it.y-player.y)**2 < 30**2){
      it.y = H+999; sfx.power();
      if(it.kind==='P') player.weapon = Math.min(3, player.weapon+1);
      if(it.kind==='H') player.hp = Math.min(player.maxHp, player.hp+1);
      if(it.kind==='S') player.shield = 8;
      score += 20;
    }
  }
  items = items.filter(i=>i.y<H+20);
  updateHUD();
}

// ---------- 繪製 ----------
function drawJet(x,y,r,body,wing){
  ctx.save(); ctx.translate(x,y);
  if(player.inv>0 && Math.floor(frame/6)%2===0) ctx.globalAlpha=.4;
  ctx.fillStyle = wing;
  ctx.beginPath(); ctx.moveTo(-r,-4); ctx.lineTo(-r-10,r); ctx.lineTo(-r+4,r-4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(r,-4); ctx.lineTo(r+10,r); ctx.lineTo(r-4,r-4); ctx.closePath(); ctx.fill();
  const g = ctx.createLinearGradient(0,-r-8,0,r+6);
  g.addColorStop(0,body); g.addColorStop(1,'#0b3d91');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0,-r-8); ctx.lineTo(9,6); ctx.lineTo(0,r+4); ctx.lineTo(-9,6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#bff1ff';
  ctx.beginPath(); ctx.ellipse(0,-4,4,9,0,0,Math.PI*2); ctx.fill();
  // 尾焰
  const f = 10+Math.random()*10;
  const fg = ctx.createLinearGradient(0,r+4,0,r+4+f+8);
  fg.addColorStop(0,'#fff'); fg.addColorStop(.4,'#ffd54a'); fg.addColorStop(1,'transparent');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.moveTo(-5,r+4); ctx.lineTo(5,r+4); ctx.lineTo(0,r+4+f+8); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // 背景
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#070b24'); bg.addColorStop(1,'#020208');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  for(const s of stars){ ctx.globalAlpha=.3+.7*(s.s/2.5); ctx.fillRect(s.x,s.y,s.s,s.s*3); }
  ctx.globalAlpha=1;

  if(state==='menu') return;

  // 道具
  for(const it of items){
    ctx.save(); ctx.translate(it.x,it.y+Math.sin(it.t*5)*3);
    ctx.fillStyle = it.kind==='P'?'#ffd54a':it.kind==='S'?'#4dd0ff':'#69f0ae';
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,it.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#04263b'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(it.kind==='P'?'P':it.kind==='S'?'S':'+',0,1);
    ctx.restore();
  }
  // 敵機
  for(const e of enemies){
    const c = e.isBoss ? ['#ff1744','#7a0f24'] : e.kind===0 ? ['#ff5252','#7a1622'] : e.kind===1 ? ['#ff9800','#7a3c00'] : ['#ce93d8','#4a148c'];
    drawJet(e.x, e.y + (e.isBoss?0:0), e.r, c[0], c[1]);
    // 倒轉機頭（敵機朝下）
    // 血條
    const max = e.isBoss? e.maxHp : (e.kind===0?1+Math.floor(level/3):e.kind===1?3+Math.floor(level/2):6+level);
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(e.x-e.r, e.y-e.r-10, e.r*2, 5);
    ctx.fillStyle = e.isBoss?'#ff1744':'#69f0ae';
    ctx.fillRect(e.x-e.r, e.y-e.r-10, e.r*2*Math.max(0,e.hp/max), 5);
    if(e.isBoss){ ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.fillText('BOSS', e.x, e.y-e.r-16); }
  }
  // 子彈
  for(const b of bullets){
    ctx.fillStyle='#fff200'; ctx.shadowColor='#ffeb3b'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.fillStyle='#ff3d81';
  for(const b of ebullets){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); }

  // 玩家
  if(state!=='over') drawJet(player.x, player.y, player.r, '#29b6f6', '#01579b');
  if(player.shield>0){
    ctx.strokeStyle=`rgba(77,208,255,${.5+.4*Math.sin(frame/8)})`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(player.x,player.y,26,0,Math.PI*2); ctx.stroke();
  }
  // 粒子
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life*2); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;

  // Boss 警告 / 分數提示
  if(state==='playing'){
    ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='13px sans-serif'; ctx.textAlign='left';
    ctx.fillText(`武器 Lv.${player.weapon}` + (player.shield>0 ? '  🛡️' : ''), 10, H-12);
  }
}

function loop(t){
  const dt = Math.min(0.033, (t-lastTime)/1000 || 0.016);
  lastTime = t;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
